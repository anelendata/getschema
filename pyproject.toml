[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "getschema"
version = "0.2.11"
description = "Get jsonschema from sample records"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
  { "name" = "Daigo Tanaka" },
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]

dependencies = [
    "jsonpath-ng",
    "python-dateutil",
    "simplejson>=3.13.2,<4.0.0",
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/anelendata/getschema"

[project.scripts]
getschema = "getschema:main.main"

[tool.setuptools.packages.find]
where = ["."]
include = ["getschema*"]

[tool.setuptools]
include-package-data = true

[dependency-groups]
dev = [
    "build>=1.3.0",
    "pytest",
]